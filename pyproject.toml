[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zoidcartto-seqlendist"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告微调数据的序列长度分布相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "zoidcartto" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://zoidcartto.github.io"
Repository = "https://github.com/zoidcartto/seqlendist"
Issues = "https://github.com/zoidcartto/seqlendist/issues"

[project.scripts]
seqlendist = "seqlendist:main"

[tool.setuptools]
py-modules = ["seqlendist"]
